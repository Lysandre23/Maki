<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root { --hud: #ffd21e; --red: #ff2d2d; --ally: #3c8cff; --fire: #ff8a1c; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Bangers, Impact, "Arial Black", sans-serif; color: #fff; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { pointer-events: none; }
  #tac { display: none; z-index: 5; } /* tactical map, above the HUD */
  #stage, #stage canvas { cursor: none; }

  .hud { position: absolute; pointer-events: none; letter-spacing: 1px;
    color: var(--hud); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  #top { left: 14px; top: 10px; font-size: 26px; }
  #squads { left: 14px; top: 42px; font-size: 15px; line-height: 1.25; }
  #squads div { display: flex; gap: 6px; align-items: center; }
  #squads .n { width: 15px; text-align: center; background: var(--ally); color: #fff; text-shadow: none; }
  #squads .pip { display: inline-block; width: 8px; height: 8px; border: 1px solid #000; background: var(--ally); margin-right: 2px; }
  #squads .pip.low { background: var(--fire); }
  #squads .pip.dead { background: #333; }
  #squads .o { color: #fff; }
  #perf { right: 12px; top: 10px; font: 12px/1.3 monospace; color: #ddd; text-shadow: 1px 1px 0 #000;
    white-space: pre; text-align: right; background: rgba(0,0,0,0.65); padding: 3px 6px; }
  #perf:empty { display: none; }
  #parts { left: 14px; bottom: 12px; font-size: 17px; line-height: 1.15; }
  #res { font-size: 16px; color: #fff; margin-bottom: 6px; background: rgba(0,0,0,0.6); padding: 3px 6px; display: inline-block; }
  #res span { margin-right: 10px; }
  #parts .row { display: flex; gap: 8px; align-items: center; pointer-events: auto; cursor: pointer; }
  #parts .key { width: 16px; text-align: center; background: #fff; color: #000; text-shadow: none; font-size: 14px; }
  #parts .name { width: 70px; }
  #parts .crew b { display: inline-block; margin-right: 3px; padding: 0 4px; background: #000; color: #fff;
    border: 1px solid #fff; font-weight: normal; font-size: 13px; text-shadow: none; }
  #parts .row.repairing .crew b { animation: wrench .4s steps(2) infinite; }
  @keyframes wrench { 50% { background: var(--hud); color: #000; } }
  #help { right: 12px; bottom: 10px; font-size: 14px; color: #fff; background: rgba(0,0,0,0.6); padding: 3px 8px; text-align: right; line-height: 1.3; }
  #parts .bar { width: 120px; height: 9px; border: 2px solid #fff; background: #000; box-shadow: 1px 1px 0 #000; }
  #parts .fill { height: 100%; background: #fff; }
  #parts .row.low .fill { background: var(--fire); }
  #parts .row.dead .name { text-decoration: line-through; }
  #parts .row.dead .bar { border-color: var(--fire); }

  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(0,0,0,0.55); }
  #overlay h1 { margin: 0 0 18px; font-size: 64px; font-weight: normal; color: #fff; letter-spacing: 3px;
    text-shadow: 4px 4px 0 #000, -2px -2px 0 #000; }
  #overlay h1.red { color: var(--fire); }
  #overlay p { margin: 6px; font-size: 22px; letter-spacing: 1px; }
  /* ---------------------------------------------------------- reward cards */
  :root { --gold: #f5c542; }
  #cards { display: flex; gap: 24px; align-items: stretch; }
  .card { position: relative; width: 230px; padding: 0 16px 16px; background: #fff; color: #000; border: 4px solid #000;
    box-shadow: 8px 8px 0 #000, 0 0 0 3px #fff; cursor: pointer; transform: rotate(-1.5deg); transition: transform .12s;
    display: flex; flex-direction: column; }
  .card:nth-child(2) { transform: rotate(1deg); }
  .card:hover { transform: rotate(0) scale(1.06); z-index: 2; }
  .card .band { margin: 0 -16px 10px; padding: 4px 10px; background: var(--hud); color: #000; font-size: 18px; letter-spacing: 2px; }
  .card.fam-team .band { background: var(--ally); color: #fff; }
  .card .rar { position: absolute; top: 5px; right: 10px; font-size: 14px; letter-spacing: 1px; color: #000; }
  .card.fam-team .rar { color: #fff; }
  .card .key { align-self: flex-start; background: #000; color: #fff; padding: 0 8px; font-size: 20px; }
  .card h2 { margin: 8px 0 8px; font-size: 30px; line-height: 1; font-weight: normal; letter-spacing: 1px; color: #000; }
  .card div.desc { font-family: "Comic Sans MS", "Segoe Print", sans-serif; font-size: 15px; flex: 1; }
  .card .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-style: normal; font-size: 13px; padding: 0 5px; border: 2px solid #000; letter-spacing: 1px; }
  .card .syn { margin-top: 8px; padding: 2px 6px; background: #000; color: var(--hud); font-size: 16px; letter-spacing: 1px;
    animation: syn 0.8s steps(2) infinite; }
  @keyframes syn { 50% { color: #fff; } }
  /* rarity frames: common plain, rare double ink, epic inverted halftone, legendary gold */
  .card.rare { border-style: double; border-width: 8px; }
  .card.epic { background: #111 radial-gradient(#444 1px, transparent 1.2px) 0 0 / 6px 6px; color: #fff; border-color: #fff;
    box-shadow: 8px 8px 0 #000, 0 0 0 3px #000, 0 0 0 6px #fff; }
  .card.epic h2 { color: #fff; } .card.epic .key { background: #fff; color: #000; } .card.epic .tag { border-color: #fff; color: #fff; }
  .card.legendary { background: #000 radial-gradient(#3a2e00 1px, transparent 1.2px) 0 0 / 5px 5px; color: #fff;
    border-color: var(--gold); box-shadow: 8px 8px 0 #000, 0 0 0 3px #000, 0 0 22px 4px var(--gold); animation: legend 1.6s ease-in-out infinite; }
  .card.legendary h2 { color: var(--gold); }
  .card.legendary .key { background: var(--gold); color: #000; } .card.legendary .tag { border-color: var(--gold); color: var(--gold); }
  @keyframes legend { 50% { box-shadow: 8px 8px 0 #000, 0 0 0 3px #000, 0 0 34px 10px var(--gold); } }
  #build { margin-top: 18px; max-width: 820px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  #build > span:first-child { font-size: 18px; margin-right: 6px; color: var(--hud); }
  .chip { font-size: 13px; padding: 1px 6px; background: #fff; color: #000; border: 2px solid #000; letter-spacing: 1px; }
  .chip.fam-team { background: var(--ally); color: #fff; }
  .chip.epic { outline: 2px solid #fff; } .chip.legendary { outline: 2px solid var(--gold); box-shadow: 0 0 8px var(--gold); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <canvas id="fx"></canvas>
    <canvas id="tac"></canvas>
    <div id="top" class="hud"></div>
    <div id="squads" class="hud"></div>
    <div id="perf" class="hud"></div>
    <div id="parts" class="hud"></div>
    <div id="help" class="hud">LMB CANNON · RMB MACHINE GUN · SPACE SMOKE<br>1-7 SEND MECHANIC · E EMERGENCY PATCH · C POWER MODE<br>TAB TACTICAL MAP · O SHOW ORDERS · TAKE THE FLAG</div>
    <div id="overlay"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
